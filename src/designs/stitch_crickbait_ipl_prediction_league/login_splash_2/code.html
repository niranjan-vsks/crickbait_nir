<!DOCTYPE html>

<div class="absolute left-1/4 top-0 w-[1px] h-full border-l border-dashed border-outline-variant transform skew-x-12 opacity-50"></div>
<div class="absolute right-1/4 top-0 w-[1px] h-full border-r border-dashed border-outline-variant transform skew-x-12 opacity-50"></div>

</div>

<div class="flex flex-col items-center text-center space-y-md"><!-- Stylized Cricket Ball Icon -->

<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">
            sports_cricket

</div>
</div>

    CRICKBAIT
</h1>
<!-- Serious Non-Serious Text -->
<p class="font-body-main text-[10px] tracking-[0.2em] text-outline-variant uppercase mb-4">

</p>
<!-- Tagline -->
<p class="font-body-main text-lg text-on-surface-variant italic">
    Predict. Gloat. Repeat.
</p></div>
<!-- Authentication CTA -->
<div class="w-full mt-xl pb-8">
